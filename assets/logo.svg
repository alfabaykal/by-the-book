<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280" role="img" aria-label="Kilroy read the manual: a bald head in round glasses peeks over a thick open manual, his long nose drooping over the pages and his fingers gripping its edge">
  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- bookmark tabs behind the top edge -->
    <g stroke-width="3">
      <path d="M40 150 L40 118 Q40 112 46 112 L58 112 Q64 112 64 118 L64 150" fill="#f6e2a6" stroke="#c99a2e"/>
      <path d="M70 146 L70 128 Q70 122 76 122 L86 122 Q92 122 92 128 L92 146" fill="#f5c9d2" stroke="#c9667b"/>
      <path d="M318 146 L318 124 Q318 118 324 118 L334 118 Q340 118 340 124 L340 146" fill="#cde5d0" stroke="#4f9160"/>
      <path d="M344 150 L344 114 Q344 108 350 108 L360 108 Q366 108 366 114 L366 150" fill="#f6e2a6" stroke="#c99a2e"/>
    </g>

    <!-- the head, sticker edge first so it holds on dark backgrounds -->
    <path d="M128 162 C126 96 158 62 200 62 C242 62 274 96 272 162" fill="#ffffff" stroke="#ffffff" stroke-width="14"/>
    <g fill="none" stroke="#3d5a80">
      <path d="M128 162 C126 96 158 62 200 62 C242 62 274 96 272 162" fill="#f4f7fb" stroke-width="4"/>
      <!-- three hairs -->
      <path d="M190 64 C186 50 190 40 198 34" stroke-width="3"/>
      <path d="M200 62 C200 46 206 36 215 31" stroke-width="3"/>
      <path d="M210 64 C214 54 222 48 231 48" stroke-width="3"/>
      <!-- brows: one up, one level -->
      <path d="M156 104 Q170 98 184 103" stroke-width="3.5"/>
      <path d="M214 96 Q229 86 244 94" stroke-width="3.5"/>
      <!-- round glasses -->
      <circle cx="173" cy="128" r="19" fill="#ffffff" stroke-width="4"/>
      <circle cx="227" cy="128" r="19" fill="#ffffff" stroke-width="4"/>
      <path d="M192 126 Q200 119 208 126" stroke-width="4"/>
      <path d="M154 124 L131 116 M246 124 L269 116" stroke-width="3.5"/>
      <path d="M161 119 Q166 114 172 114 M215 119 Q220 114 226 114" stroke="#b9c8da" stroke-width="3"/>
      <!-- eyes, reading the page -->
      <circle cx="175" cy="136" r="5.5" fill="#24364d" stroke="none"/>
      <circle cx="229" cy="136" r="5.5" fill="#24364d" stroke="none"/>
    </g>

    <!-- the thick open manual: the wall -->
    <path d="M18 160 Q109 136 200 156 Q291 136 382 160 L382 246 Q291 224 200 244 Q109 224 18 246 Z" fill="#ffffff" stroke="#ffffff" stroke-width="14"/>
    <g stroke="#3d5a80">
      <!-- page block under the open pages -->
      <path d="M18 236 L18 246 Q109 224 200 244 Q291 224 382 246 L382 236" fill="#e9eef5" stroke-width="3.5"/>
      <path d="M18 241 Q109 219 200 239 Q291 219 382 241" fill="none" stroke-width="1.5" opacity="0.5"/>
      <!-- pages -->
      <path d="M18 160 Q109 136 200 156 Q291 136 382 160 L382 236 Q291 214 200 234 Q109 214 18 236 Z" fill="#ffffff" stroke-width="4"/>
      <path d="M200 156 L200 234" fill="none" stroke-width="3"/>
      <!-- highlighter over one line -->
      <path d="M40 196 Q100 182 170 194" fill="none" stroke="#f3d34a" stroke-opacity="0.75" stroke-width="10" stroke-linecap="butt"/>
      <!-- lines of text -->
      <path d="M40 180 Q100 166 172 178 M40 196 Q100 182 172 194 M40 212 Q100 198 172 210 M228 178 Q300 166 360 180 M228 194 Q300 182 360 196 M228 210 Q300 198 330 204" fill="none" stroke-width="2" opacity="0.45"/>
      <!-- a margin tick -->
      <path d="M344 206 L350 213 L362 198" fill="none" stroke="#4f9160" stroke-width="3"/>
    </g>
    <!-- ribbon bookmark hanging from the spine -->
    <path d="M196 244 L196 270 L200 264 L204 270 L204 244" fill="#d9536a" stroke="#a83a50" stroke-width="2"/>

    <!-- the nose droops over the edge -->
    <path d="M192 132 C186 160 184 196 194 208 C202 216 216 210 214 194 C212 170 210 148 208 132" fill="#f4f7fb" stroke="#3d5a80" stroke-width="4"/>

    <!-- fingertips curl over the edge, four on each side of the head -->
    <g fill="#f4f7fb" stroke="#3d5a80" stroke-width="3.2" stroke-linejoin="round">
      <path d="M85.5 146.3 Q85.5 139.8 92.0 139.8 Q98.5 139.8 98.5 146.3 L98.5 154.3 Q98.5 160.8 92.0 160.8 Q85.5 160.8 85.5 154.3 Z" transform="rotate(-3.9 92.0 147.8)"/>
      <path d="M89.0 152.8 L89.0 157.3 Q89.0 160.3 92.0 160.3 Q95.0 160.3 95.0 157.3 L95.0 152.8" fill="#ffffff" stroke-width="1.8" transform="rotate(-3.9 92.0 147.8)"/>
      <path d="M98.5 144.6 Q98.5 137.1 106.0 137.1 Q113.5 137.1 113.5 144.6 L113.5 155.6 Q113.5 163.1 106.0 163.1 Q98.5 163.1 98.5 155.6 Z" transform="rotate(-1.7 106.0 147.1)"/>
      <path d="M102.0 155.1 L102.0 159.6 Q102.0 162.6 106.0 162.6 Q110.0 162.6 110.0 159.6 L110.0 155.1" fill="#ffffff" stroke-width="1.8" transform="rotate(-1.7 106.0 147.1)"/>
      <path d="M113.5 143.4 Q113.5 135.9 121.0 135.9 Q128.5 135.9 128.5 143.4 L128.5 156.4 Q128.5 163.9 121.0 163.9 Q113.5 163.9 113.5 156.4 Z" transform="rotate(0.6 121.0 146.9)"/>
      <path d="M117.0 155.9 L117.0 160.4 Q117.0 163.4 121.0 163.4 Q125.0 163.4 125.0 160.4 L125.0 155.9" fill="#ffffff" stroke-width="1.8" transform="rotate(0.6 121.0 146.9)"/>
      <path d="M128.5 144.9 Q128.5 137.4 136.0 137.4 Q143.5 137.4 143.5 144.9 L143.5 154.9 Q143.5 162.4 136.0 162.4 Q128.5 162.4 128.5 154.9 Z" transform="rotate(2.9 136.0 147.4)"/>
      <path d="M132.0 154.4 L132.0 158.9 Q132.0 161.9 136.0 161.9 Q140.0 161.9 140.0 158.9 L140.0 154.4" fill="#ffffff" stroke-width="1.8" transform="rotate(2.9 136.0 147.4)"/>
      <path d="M301.5 146.3 Q301.5 139.8 308.0 139.8 Q314.5 139.8 314.5 146.3 L314.5 154.3 Q314.5 160.8 308.0 160.8 Q301.5 160.8 301.5 154.3 Z" transform="rotate(3.9 308.0 147.8)"/>
      <path d="M305.0 152.8 L305.0 157.3 Q305.0 160.3 308.0 160.3 Q311.0 160.3 311.0 157.3 L311.0 152.8" fill="#ffffff" stroke-width="1.8" transform="rotate(3.9 308.0 147.8)"/>
      <path d="M286.5 144.6 Q286.5 137.1 294.0 137.1 Q301.5 137.1 301.5 144.6 L301.5 155.6 Q301.5 163.1 294.0 163.1 Q286.5 163.1 286.5 155.6 Z" transform="rotate(1.7 294.0 147.1)"/>
      <path d="M290.0 155.1 L290.0 159.6 Q290.0 162.6 294.0 162.6 Q298.0 162.6 298.0 159.6 L298.0 155.1" fill="#ffffff" stroke-width="1.8" transform="rotate(1.7 294.0 147.1)"/>
      <path d="M271.5 143.4 Q271.5 135.9 279.0 135.9 Q286.5 135.9 286.5 143.4 L286.5 156.4 Q286.5 163.9 279.0 163.9 Q271.5 163.9 271.5 156.4 Z" transform="rotate(-0.6 279.0 146.9)"/>
      <path d="M275.0 155.9 L275.0 160.4 Q275.0 163.4 279.0 163.4 Q283.0 163.4 283.0 160.4 L283.0 155.9" fill="#ffffff" stroke-width="1.8" transform="rotate(-0.6 279.0 146.9)"/>
      <path d="M256.5 144.9 Q256.5 137.4 264.0 137.4 Q271.5 137.4 271.5 144.9 L271.5 154.9 Q271.5 162.4 264.0 162.4 Q256.5 162.4 256.5 154.9 Z" transform="rotate(-2.9 264.0 147.4)"/>
      <path d="M260.0 154.4 L260.0 158.9 Q260.0 161.9 264.0 161.9 Q268.0 161.9 268.0 158.9 L268.0 154.4" fill="#ffffff" stroke-width="1.8" transform="rotate(-2.9 264.0 147.4)"/>
    </g>
  </g>
</svg>
